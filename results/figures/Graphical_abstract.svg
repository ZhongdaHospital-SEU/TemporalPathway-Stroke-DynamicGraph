<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="430" fill="#ffffff"/>
<!-- Title -->
<text x="750" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Temporal Pathway-Regularized Dynamic Graph Learning for Ordinal Stroke Recovery Prediction</text>
<text x="750" y="64" text-anchor="middle" font-size="13" fill="#555">MIMIC-IV + eICU-CRD + GEO blood transcriptomic cohorts</text>

<!-- Panel 1: ICU time series -->
<rect x="40" y="100" width="300" height="250" rx="12" fill="#eef4fb" stroke="#2e5f9e" stroke-width="2"/>
<text x="190" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">1. ICU time series</text>
<text x="190" y="145" text-anchor="middle" font-size="12" fill="#333">64 h hourly grid, 14 channels</text>
<polyline points="70,280 110,265 150,270 190,250 230,258 270,240 310,248" fill="none" stroke="#2e5f9e" stroke-width="3"/>
<polyline points="70,215 110,222 150,210 190,215 230,205 270,208 310,198" fill="none" stroke="#c0392b" stroke-width="2"/>
<polyline points="70,320 110,312 150,318 190,305 230,310 270,300 310,305" fill="none" stroke="#27ae60" stroke-width="2"/>
<text x="190" y="345" text-anchor="middle" font-size="11" fill="#555">HR  SBP  GCS  SpO2  ...  labs</text>

<!-- arrow -->
<line x1="345" y1="225" x2="395" y2="225" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

<!-- Panel 2: Pathway atlas -->
<rect x="400" y="100" width="300" height="250" rx="12" fill="#fdf3e7" stroke="#b9770e" stroke-width="2"/>
<text x="550" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">2. Pathway atlas</text>
<text x="550" y="145" text-anchor="middle" font-size="12" fill="#333">GEO blood transcriptomic cohorts</text>
<text x="550" y="168" text-anchor="middle" font-size="12" fill="#333">GSE37587, GSE58294, GSE16561, GSE22255</text>
<text x="550" y="192" text-anchor="middle" font-size="12" fill="#333">SSGSEA activity, 12,614 gene sets</text>
<text x="550" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b9770e">70 remodeled pathways (subacute phase)</text>
<rect x="460" y="235" width="180" height="16" rx="8" fill="#b9770e" opacity="0.85"/>
<text x="550" y="247" text-anchor="middle" font-size="9" fill="#fff">temporal pathway prior</text>
<text x="550" y="340" text-anchor="middle" font-size="11" fill="#555">immune, neural-repair, transcription programs</text>

<!-- arrow -->
<line x1="705" y1="225" x2="755" y2="225" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

<!-- Panel 3: Model -->
<rect x="760" y="100" width="330" height="250" rx="12" fill="#eef9f1" stroke="#1e7d46" stroke-width="2"/>
<text x="925" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">3. DG-GRU + TPR</text>
<circle cx="860" cy="215" r="26" fill="#1e7d46" opacity="0.9"/>
<circle cx="925" cy="185" r="26" fill="#2a9d5c" opacity="0.9"/>
<circle cx="990" cy="215" r="26" fill="#1e7d46" opacity="0.9"/>
<circle cx="925" cy="250" r="26" fill="#2a9d5c" opacity="0.9"/>
<line x1="886" y1="205" x2="901" y2="195" stroke="#fff" stroke-width="2"/>
<line x1="951" y1="195" x2="964" y2="205" stroke="#fff" stroke-width="2"/>
<line x1="886" y1="225" x2="901" y2="240" stroke="#fff" stroke-width="2"/>
<line x1="951" y1="240" x2="964" y2="225" stroke="#fff" stroke-width="2"/>
<line x1="891" y1="233" x2="921" y2="253" stroke="#fff" stroke-width="1.5"/>
<text x="925" y="300" text-anchor="middle" font-size="12" fill="#333">dynamic feature graph + gated recurrent unit</text>
<text x="925" y="320" text-anchor="middle" font-size="12" fill="#333">latent recovery score with monotone and drift</text>
<text x="925" y="338" text-anchor="middle" font-size="12" fill="#333">regularizers driven by the pathway prior</text>

<!-- arrow -->
<line x1="1095" y1="225" x2="1145" y2="225" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

<!-- Panel 4: Outcome + validation -->
<rect x="1150" y="100" width="310" height="250" rx="12" fill="#f4eefb" stroke="#6c3483" stroke-width="2"/>
<text x="1305" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">4. Ordinal outcome</text>
<text x="1305" y="150" text-anchor="middle" font-size="12" fill="#333">six-level discharge disposition</text>
<text x="1305" y="172" text-anchor="middle" font-size="12" fill="#333">home, home care, rehab, SNF, hospice, death</text>
<line x1="1190" y1="200" x2="1420" y2="200" stroke="#6c3483" stroke-width="2"/>
<text x="1305" y="225" text-anchor="middle" font-size="12" fill="#333">stacked ensemble: macro-AUC 0.830</text>
<text x="1305" y="248" text-anchor="middle" font-size="12" fill="#333">external validation eICU-CRD: n = 12,820</text>
<text x="1305" y="268" text-anchor="middle" font-size="12" fill="#333">transfer macro-AUC 0.809, mortality AUROC 0.962</text>
<text x="1305" y="288" text-anchor="middle" font-size="12" fill="#333">stable under narrow stroke definition</text>
<text x="1305" y="330" text-anchor="middle" font-size="11" fill="#555">no leakage: negative controls, seed and label audits</text>

<text x="750" y="415" text-anchor="middle" font-size="11" fill="#777">DG-GRU+TPR, dynamic graph gated recurrent unit with temporal pathway regularizer; SSGSEA, single-sample gene-set enrichment; SNF, skilled nursing facility.</text>
</svg>